<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #070b19 0%, #0d1b2a 50%, #1b263b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            color: #e0e1dd;
        }

        .login {
            width: 100%;
            max-width: 650px;
            background: rgba(13, 27, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(58, 134, 255, 0.1);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        input, select {
            width: 100%;
            padding: 13px 15px;
            background: #111e33;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus, select:focus {
            border-color: #3a86ff;
            background: #15253f;
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.25);
        }

        select option {
            background: #0d1b2a;
            color: #ffffff;
        }

        button[type="submit"] {
            grid-column: span 2;
            margin-top: 8px;
            padding: 14px;
            background: linear-gradient(135deg, #1d4ed8 0%, #3a86ff 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(58, 134, 255, 0.45);
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        h2 {
            margin-top: 25px;
            padding: 18px;
            background: rgba(30, 58, 95, 0.45);
            border: 1px solid rgba(58, 134, 255, 0.35);
            border-radius: 12px;
            text-align: center;
            color: #60a5fa;
            font-size: 1.25rem;
            font-weight: 700;
        }

        @media (max-width: 580px) {
            form {
                grid-template-columns: 1fr;
            }
            button[type="submit"] {
                grid-column: span 1;
            }
            .login {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>🚗 Car Selling Price Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input type="number" name="vehicle_age" placeholder="Vehicle Age (Years)" required>

            <input type="number" name="km_driven" placeholder="Kilometers Driven" required>

            <select name="seller_type" required>
                <option value="">Select Seller Type</option>
                <option value="Individual">Individual</option>
                <option value="Dealer">Dealer</option>
                <option value="Trustmark Dealer">Trustmark Dealer</option>
            </select>

            <select name="fuel_type" required>
                <option value="">Select Fuel Type</option>
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
                <option value="LPG">LPG</option>
                <option value="Electric">Electric</option>
            </select>
            
            <select name="model" required>
                <option value="">Select Model</option>
                <option value="Alto">Alto</option>
                <option value="Grand">Grand</option>
                <option value="i20">i20</option>
                <option value="Ecosport">Ecosport</option>
                <option value="Wagon R">Wagon R</option>
                <option value="i10">i10</option>
                <option value="Venue">Venue</option>
                <option value="Swift">Swift</option>
                <option value="Verna">Verna</option>
                <option value="Duster">Duster</option>
                <option value="Cooper">Cooper</option>
                <option value="Ciaz">Ciaz</option>
                <option value="C-Class">C-Class</option>
                <option value="Innova">Innova</option>
            </select>
            
            <select name="transmission_type" required>
                <option value="">Select Transmission Type</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>

            <input type="number" step="0.01" name="mileage" placeholder="Mileage (km/l)" required>

            <input type="number" name="engine" placeholder="Engine (CC)" required>

            <input type="number" step="0.01" name="max_power" placeholder="Max Power (BHP)" required>

            <input type="number" name="seats" placeholder="Number of Seats" required>

            <button type="submit">Predict Selling Price</button>

        </form>

        {% if result %}
        <h2>
            Predicted Selling Price: ₹{{ result }}
        </h2>
        {% endif %}

    </div>

</body>

</html>
